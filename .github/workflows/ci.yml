name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Science engine: pure JVM tests (profiles, color model, stages, CPU reference renderer).
      - name: Core tests
        run: ./gradlew :core:test

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Android lint
        run: ./gradlew :app:lintDebug

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            core/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  # The GPU tests (app/src/androidTest) need a real GPU and camera surface path; they run on a
  # device with:  ./gradlew :app:connectedDebugAndroidTest
